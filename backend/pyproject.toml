[project]
name = "yunshu-backend"
version = "0.1.0"
description = "云枢智学 FastAPI 基础工程"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "pymysql[rsa]>=1.1,<2", "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26", "pillow>=11,<13", "pydantic-settings>=2.7,<3", "redis>=5.2,<7", "minio>=7.2,<8", "sqlparse>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
